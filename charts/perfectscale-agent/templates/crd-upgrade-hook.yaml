{{/*
  CRD lifecycle hook — applies all CRDs from the crds/ directory before
  upgrade so that `helm upgrade` picks up new or changed CRDs.
  Helm 3 natively handles crds/ on initial install, so this hook
  only runs on pre-upgrade.

  If CRD apply fails, the upgrade is aborted.
  All hook resources are cleaned up on both success and failure.

  Resources in this file (all ephemeral hook resources):
    Weight -10: ConfigMap, ServiceAccount, ClusterRole, ClusterRoleBinding
    Weight -5:  Job (psc-exporter crds apply)
*/}}
{{- if .Values.crdUpgradeHook.enabled }}
# ---------- ConfigMap: embeds all CRD manifests from crds/ ----------
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helm.crdUpgradeHookName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "helm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
data:
  {{- range $path, $content := .Files.Glob "crds/*" }}
  {{ base $path }}: |
{{ $content | toString | indent 4 }}
  {{- end }}
---
# ---------- ServiceAccount for the hook Job ----------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "helm.crdUpgradeHookName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "helm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
automountServiceAccountToken: false
---
# ---------- ClusterRole: minimum privilege for CRD management ----------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "helm.crdUpgradeHookName" . }}
  labels: {{- include "helm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["create", "get", "list", "patch", "update", "watch"]
---
# ---------- ClusterRoleBinding ----------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "helm.crdUpgradeHookName" . }}
  labels: {{- include "helm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
subjects:
  - kind: ServiceAccount
    name: {{ include "helm.crdUpgradeHookName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "helm.crdUpgradeHookName" . }}
  apiGroup: rbac.authorization.k8s.io
---
# ---------- Job: apply CRDs and wait for them to be established ----------
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "helm.crdUpgradeHookName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  backoffLimit: {{ .Values.crdUpgradeHook.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "helm.selectorLabels" . | nindent 8 }}
        job: crd-upgrade-hook
    spec:
      serviceAccountName: {{ include "helm.crdUpgradeHookName" . }}
      automountServiceAccountToken: true
      restartPolicy: Never
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: crd-apply
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: [ "/opt/app" ]
          args: [ "crds", "apply" ]
          env:
            - name: KUBE_API_TIMEOUT
              value: "{{ .Values.settings.kubeAPITimeoutSec }}"
          resources:
            {{- toYaml .Values.crdUpgradeHook.resources | nindent 12 }}
          volumeMounts:
            - name: crds
              mountPath: /crds
              readOnly: true
      volumes:
        - name: crds
          configMap:
            name: {{ include "helm.crdUpgradeHookName" . }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets.secretName }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
