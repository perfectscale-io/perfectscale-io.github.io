apiVersion: perfectscale.io/v1
kind: NodeGroupAutomationConfig
metadata:
  name: general-purpose
spec:
  targetRef:
    kind: NodeGroup # NodePool for Karpenter, NodeGroup otherwise
    name: general-purpose # node group name as PerfectScale shows it
  automation:
    binpacking:
      operational:
        automationMode: Enabled
        evictBarePods: true
      karpenter:
        doNotDisruptFor: "30m"
      safety:
        allowHostPath: false # default false: skip nodes running pods with stateful hostPath volumes
        allowRunningJobs: false # default false: skip nodes running Job pods
        pdbOverride: # WARNING: deletes pods despite their PDBs once eviction stays refused for 2m, overrides the cluster's per field
          enabled: false # default false
          respectGracePeriod: true # default true: false deletes with grace period 0
        protectedPodSelectors: # a node running a matching pod is skipped, merged with the cluster's
          - matchLabels:
              app: payments
        excludedNodeSelectors: # a node with matching labels is skipped, merged with the cluster's
          - matchLabels:
              workload-tier: critical
