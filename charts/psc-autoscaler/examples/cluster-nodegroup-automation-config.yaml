apiVersion: perfectscale.io/v1
kind: ClusterNodeGroupAutomationConfig
metadata:
  name: cluster-nodegroup-automation
spec:
  automation:
    operational:
      stopAllAutomation: false
      cleanUpAutomation: false
    karpenter:
      operational:
        automationMode: Enabled
        stopAllAutomation: false
        cleanUpAutomation: false
    binpacking:
      operational:
        automationMode: DryRun
        evictBarePods: true
      safety:
        allowHostPath: false
        allowRunningJobs: false
        # allowAtMinSize: false # default false: skip a cluster-autoscaler node group at its min size
        # blockOnPodAnnotations: # a node running a pod with the annotation (empty value = any) is skipped
        #   karpenter.sh/do-not-disrupt: "true"
        #   cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        # block: # all default false, a group cannot lift a true
        #   kubeSystemPods: true
        #   gpuNodes: true
        #   diskEmptyDirPods: true
        pdbOverride: # WARNING: deletes pods despite their PDBs once eviction stays refused for 2m
          enabled: false # default false
          respectGracePeriod: true # default true: false deletes with grace period 0
        excludedNodeSelectors:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
