                        safety:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                          properties:
                            allowHostPath:
                              type: boolean
                              description: >-
                                Default false: a node running a pod with a hostPath volume outside the system
                                allowlist is skipped, since its data dies with the instance.
                            allowRunningJobs:
                              type: boolean
                              description: >-
                                Default false: a node running a Job pod is skipped.
                            allowAtMinSize:
                              type: boolean
                              description: >-
                                Default false: a cluster-autoscaler node group already at its min size is skipped, since the autoscaler would
                                only replace the drained node. true lifts the block.
                            blockOnPodAnnotations:
                              type: object
                              additionalProperties:
                                type: string
                              description: >-
                                A node running a pod with an annotation key set to the mapped value is skipped; an empty value means any value
                                of that key blocks. Merged per key, the cluster value wins on conflict and a group can only add keys.
                                Do-not-disrupt example: {"karpenter.sh/do-not-disrupt":"true","cluster-autoscaler.kubernetes.io/safe-to-evict":"false"}.
                            block:
                              type: object
                              x-kubernetes-preserve-unknown-fields: true
                              description: >-
                                Opt-in blocks, all off when unset. Merged with OR: a group cannot lift a cluster-wide block.
                              properties:
                                kubeSystemPods:
                                  type: boolean
                                  description: A node running a non-DaemonSet kube-system pod is skipped.
                                gpuNodes:
                                  type: boolean
                                  description: A node with a GPU extended resource (nvidia.com/gpu, amd.com/gpu, any */gpu) is skipped.
                                diskEmptyDirPods:
                                  type: boolean
                                  description: A node running a pod with a disk-backed emptyDir is skipped.
                            pdbOverride:
                              type: object
                              description: >-
                                Overrides a PodDisruptionBudget that keeps refusing eviction: after a 2 minute wait the pod is deleted
                                directly despite the PDB. WARNING: opt-in, off by default; the budget is NOT honored, so the workload may
                                lose availability or data. A group overrides the cluster per field. A pod covered by several PDBs, which the
                                Eviction API refuses with a 500, is overridden the same way. respectGracePeriod=false deletes with grace 0,
                                so a StatefulSet replacement may start early.
                              properties:
                                enabled:
                                  type: boolean
                                  description: >-
                                    Default false. True deletes pods despite their PodDisruptionBudgets once the eviction
                                    stays refused.
                                respectGracePeriod:
                                  type: boolean
                                  description: >-
                                    Default true: the deleted pod keeps its own termination grace period. False deletes
                                    it with grace period 0, so a StatefulSet replacement may start before the old
                                    container stops.
                            protectedPodSelectors:
                                type: array
                                description: Label selectors (a union across cluster and group). A node running a matching pod is skipped.
                                items:
                                  type: object
                                  x-kubernetes-preserve-unknown-fields: true
                            excludedNodeSelectors:
                                type: array
